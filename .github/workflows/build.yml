name: Build

on:
  push:
    branches:
      - ino_dev

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Create artifact
        run: |
          mkdir artifacts
          echo "Build OK" > artifacts/result.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: artifacts/
