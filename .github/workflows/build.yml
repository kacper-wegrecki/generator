name: Build

on:
  push:
    branches:
      - ino_dev

  pull_request:
    branches:
      - ino_dev

  workflow_dispatch:

jobs:
  build-and-quality:
    name: Build, Test and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Weryfikacja że projekt się buduje / instaluje poprawnie
      - name: Verify package integrity
        run: npm pack

      # Jeżeli repo posiada lint
      - name: Run lint
        run: npm run lint --if-present

      # Uruchomienie testów
      - name: Run tests
        run: npm test

      # Utworzenie artefaktu
      - name: Create artifact package
        run: |
          mkdir artifact
          cp package.json artifact/
          cp -r bin artifact/ 2>/dev/null || true
          cp -r lib artifact/ 2>/dev/null || true
          cp -r templates artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ino-dev-build-artifact
          path: artifact/
          retention-days: 7
